name: Quality and desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libasound2-dev
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Prepare and verify packaged YouTube helpers
        run: npm run youtube:prepare
      - name: Smoke-test packaged helper executables
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          "./src-tauri/tools/yt-dlp$suffix" --ignore-config --no-plugin-dirs --version
          "./src-tauri/tools/node$suffix" --version
      - run: npm run rust:fmt
      - run: npm run rust:lint
      - run: npm run rust:test
      - name: Compile desktop application without publishing
        run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}
      - name: Verify Monterey deployment metadata (app and helpers)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch="x86_64"
          if [[ "${{ matrix.target }}" == aarch64* ]]; then arch="arm64"; fi
          python3 scripts/check-macos-minimum.py --arch "$arch" src-tauri/tools/yt-dlp src-tauri/tools/node src-tauri/target/${{ matrix.target }}/release/zenith-player
